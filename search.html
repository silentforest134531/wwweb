<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>WWWeb</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
   <div style="display:flex; justify-content:center;">
     <a href="/index.html" style="display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;">
      <img src="logo.png" alt="WWWeb logo" style="width:128px; height:128px;">
      <h1 title="The World Wide Website" style="margin:0;">WWWeb</h1>
     </a>
    </div>
    <hr>
    <form action="/search.html" method="GET">
      <input type=search name="query" placeholder="Search articles...">
      <button type="submit">Search</button>
    </form>
    <hr>
    <h2>Search Results</h2>
    <hr>
    <script type="module">
      const params = new URLSearchParams(window.location.search);
      const query = params.get("query");
      const response = await fetch(`api/search?query=${query}`)
      const reply = await response.json();
      response.forEach(search => {
        const link = document.createElement('a');
        link.href = search;
        link.textContent = link.href;
        document.body.appendChild(link);
      });
    </script>
  </body>
</html>
